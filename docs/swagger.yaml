host: localhost:55667
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: admin dashboard system with RBAC
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ShadMIN API
  version: "1.0"
paths:
  /Login:
    post:
      consumes:
      - application/json
      description: Log in with phone number and password; returns the access token
        string in data
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ClientLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Access token
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/domain.Response'
        "423":
          description: Account temporarily locked
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Client login
      tags:
      - Client
  /Register:
    post:
      consumes:
      - application/json
      description: Register with phone number and password; binds the default client
        role
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ClientRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Registration succeeded
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/domain.Response'
        "409":
          description: Phone already registered
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Register a client account
      tags:
      - Client
  /api-resources:
    get:
      consumes:
      - application/json
      description: Retrieve a list of API resources with optional filtering
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10)'
        in: query
        name: page_size
        type: integer
      - description: Filter by HTTP method
        in: query
        name: method
        type: string
      - description: Filter by module
        in: query
        name: module
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by public status
        in: query
        name: is_public
        type: boolean
      - description: Search keyword
        in: query
        name: keyword
        type: string
      - description: Filter by path
        in: query
